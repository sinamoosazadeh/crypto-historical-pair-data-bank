name: Deploy catalogue to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'web/**'
      - 'catalog/**'
      - 'docs/**'
      - 'data/**'
      - 'README.md'
      - 'LICENSE'
      - 'DATA_LICENSE.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p site/web/assets site/data
          cp index.html site/index.html
          cp sw.js site/sw.js
          cp manifest.webmanifest site/manifest.webmanifest
          cp -r web/assets/* site/web/assets/
          cp -r catalog site/catalog
          cp -r docs site/docs
          cp -r data/* site/data/
          cp LICENSE site/LICENSE
          cp DATA_LICENSE.md site/DATA_LICENSE.md
          cp README.md site/README.md
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
