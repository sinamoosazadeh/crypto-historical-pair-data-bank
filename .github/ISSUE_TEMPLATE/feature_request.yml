name: Feature request
description: Propose a discovery, data-quality or accessibility improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed solution and alternatives
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Testable acceptance criteria
    validations:
      required: true
