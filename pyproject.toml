[project]
name = "crypto-historical-pair-data-bank"
version = "0.3.0"
description = "Evidence-first catalogue and tools for historical cryptocurrency market-pair data"
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
